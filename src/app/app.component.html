<ion-app>
  <ion-split-pane contentId="main-content">
    <ion-menu contentId="main-content">
      <ion-header>
        <ion-toolbar color="primary">
          <div class="perfil">
            <div class="logo"><ion-icon name="school"></ion-icon></div>
            <div>
              <h2>EduNotas</h2>
              <p>Joan Gregorio Pérez</p>
              <small>Docente · IPMMZ</small>
            </div>
          </div>
        </ion-toolbar>
      </ion-header>

      <ion-content>
        <ion-list lines="none">
          @for (p of paginas; track p.url) {
          <ion-menu-toggle [autoHide]="false">
            <ion-item [routerLink]="p.url" routerDirection="root" routerLinkActive="activo" detail="false">
              <ion-icon slot="start" [name]="p.icono"></ion-icon>
              <ion-label>{{ p.titulo }}</ion-label>
            </ion-item>
          </ion-menu-toggle>
          }
          <ion-menu-toggle [autoHide]="false">
            <ion-item button detail="false" (click)="cerrarSesion()">
              <ion-icon slot="start" name="log-out-outline"></ion-icon>
              <ion-label>Cerrar sesión</ion-label>
            </ion-item>
          </ion-menu-toggle>
        </ion-list>
      </ion-content>
    </ion-menu>

    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
